version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeo-calendar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeo_user
      POSTGRES_PASSWORD: tradeo_secure_pass
      POSTGRES_DB: calendar_scheduling_db
    ports:
      - "5437:5432"
    volumes:
      - calendar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeo_user -d calendar_scheduling_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeo-calendar-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - calendar_redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo-calendar-backend
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      DATABASE_URL: postgresql://tradeo_user:tradeo_secure_pass@postgres:5432/calendar_scheduling_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-calendar-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo-calendar-frontend
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NEXT_PUBLIC_API_URL: http://localhost:4005
    depends_on:
      - backend

volumes:
  calendar_pgdata:
  calendar_redisdata:
