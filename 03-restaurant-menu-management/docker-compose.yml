version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeo-restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeo_user
      POSTGRES_PASSWORD: tradeo_password
      POSTGRES_DB: restaurant_menu_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeo_user -d restaurant_menu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: tradeo-restaurant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo-restaurant-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://tradeo_user:tradeo_password@postgres:5432/restaurant_menu_db?schema=public
      JWT_SECRET: super-secret-jwt-key-tradeo-phase3-restaurant-menu
      FRONTEND_URL: http://localhost:3002
      APP_BASE_URL: http://localhost:4002
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: tradeo-menu-images
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo-restaurant-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:4002/api/v1
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
