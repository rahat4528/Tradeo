version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeo_api_testing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_testing_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_api_testing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_testing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo_api_testing_backend
    environment:
      PORT: 4007
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/api_testing_db?schema=public
      JWT_SECRET: super-secret-api-testing-tool-key-32chars
      JWT_EXPIRES_IN: 7d
      ALLOW_LOCAL_DISPATCH: "true"
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo_api_testing_frontend
    environment:
      PORT: 3007
      NEXT_PUBLIC_API_URL: http://localhost:4007/api/v1
    ports:
      - "3007:3007"
    depends_on:
      - backend

volumes:
  postgres_api_testing_data:
