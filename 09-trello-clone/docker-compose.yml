version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeo_trello_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trello_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_trello_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trello_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo_trello_backend
    environment:
      PORT: 4008
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/trello_db?schema=public
      JWT_SECRET: super-secret-trello-clone-jwt-key-32chars
      JWT_EXPIRES_IN: 7d
    ports:
      - "4008:4008"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo_trello_frontend
    environment:
      PORT: 3008
      NEXT_PUBLIC_API_URL: http://localhost:4008/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:4008
    ports:
      - "3008:3008"
    depends_on:
      - backend

volumes:
  postgres_trello_data:
