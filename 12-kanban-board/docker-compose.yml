version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeo-kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_board
    ports:
      - "5443:5432"
    volumes:
      - kanban_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo-kanban-backend
    restart: unless-stopped
    environment:
      PORT: 4011
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/kanban_board?schema=public"
      JWT_SECRET: super-secret-kanban-board-jwt-key-3011
      CORS_ORIGIN: "http://localhost:3011"
    ports:
      - "4011:4011"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo-kanban-frontend
    restart: unless-stopped
    environment:
      PORT: 3011
      NEXT_PUBLIC_API_URL: "http://localhost:4011/api"
    ports:
      - "3011:3011"
    depends_on:
      - backend

volumes:
  kanban_postgres_data:
