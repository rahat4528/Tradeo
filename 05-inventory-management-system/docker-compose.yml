version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradeo-inventory-postgres
    restart: always
    environment:
      POSTGRES_USER: tradeo_user
      POSTGRES_PASSWORD: tradeo_secure_pass
      POSTGRES_DB: inventory_management_db
    ports:
      - "5436:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeo_user -d inventory_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeo-inventory-redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - inventory_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeo-inventory-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: "postgresql://tradeo_user:tradeo_secure_pass@postgres:5432/inventory_management_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-inventory-management-jwt-key
      FRONTEND_URL: "http://localhost:3004"
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeo-inventory-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4004/api/v1"
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      - backend

volumes:
  inventory_postgres_data:
  inventory_redis_data:
